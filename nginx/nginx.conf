worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include    /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    
    # Trust x-forwarded-for from upstream/proxy networks.
    # Local dev-safe broad trust; tighten this on vps to known proxy CIDRs.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format hng_json escape=json
     '{'
        '"source_ip":"$realip_remote_addr",'
        '"timestamp":"$time_iso8601",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"response_size":$body_bytes_sent'
     '}';

     access_log /var/log/nginx/hng-access.log hng_json;
     error_log /var/log/nginx/hng.log warn;

     upstream nextcloud_upstream {
        server nextcloud:80;
     }

     server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nextcloud_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-Ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header x-forwarded-proto $scheme;
        }
     }
}