services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: hng-nextcloud
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro

  nginx:
    image: nginx:latest
    container_name: hng-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - nextcloud
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      - DETECTOR_LOG_FILE=/var/log/nginx/hng-access.log
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5000
    ports:
      - "8090:5000"
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro

volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs